# The studio's teams. Each one becomes an AD security group, security-<team>, in
# OU=Groups,OU=Lab (roles/ad_people creates them on dc01). People are members of their
# team's group; catalog/*.yml login_groups say which teams may log in on fleet machines
# of a role, and service VMs will use the same groups for access later.
#
# Per team:
#   name     what people see (the welcome page, AD's "department" attribute)
#   gid      the group's RFC2307 gidNumber: workstations resolve groups by number
#            (sssd, ldap_id_mapping = False), so every group needs a stable one
#   role     the workstation a new member gets by default (catalog/<role>.yml)
#   admin    true: members are workstation admins too (the group is nested in
#            ws-admins, ad_admin_groups in ansible/group_vars/all.yml)
#   aliases  other words people use for it. The welcome page matches what someone
#            types against names and aliases, forgiving typos (lablib.match_team)
#   titles   the team's usual job titles. With the titles people in AD already have,
#            the welcome page suggests them as someone types and corrects typos
#            ("Sound Desinger"; lablib.match_title); a title nobody has yet is kept as typed
#
# Read by lablib.teams() (the portal, `lab`, tools/validate_inventory.py) and
# roles/ad_people. People themselves are never in git: they live in AD.
it:
  name: IT & Infrastructure
  gid: 10101
  role: infra
  admin: true
  aliases: [it, infrastructure, infra, systems, sysadmin, devops, operations, ops, network, studio it, tech support]
  titles: [Infrastructure Engineer, Systems Administrator, Network Engineer, DevOps Engineer, IT Support Specialist, Head of IT]
engineering:
  name: Engineering
  gid: 10102
  role: programmer
  aliases: [programming, programmer, software, code, tools, technology, engine, developer, development]
  titles: [Gameplay Programmer, Engine Programmer, Tools Programmer, Graphics Programmer, AI Programmer,
           Network Programmer, Tech Programmer, Technology Director]
