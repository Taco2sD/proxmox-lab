# Installs the self-service portal on mgmt01 (docs/self-service.md): `lab portal`.
#
# Separate from infra.yml on purpose: the portal's worker runs `lab apply`, which runs
# infra.yml, and a deployment restarts the worker. Deploying from inside a run would
# kill the run that does the deploying.

# The admin page checks passwords against dc01 over LDAPS; dc01's certificate comes from
# Samba's own CA, so the portal trusts exactly that CA (not the whole system store).
- name: dc01 - Samba's CA for the portal
  hosts: dc01
  tasks:
    - name: Read Samba's CA certificate
      ansible.builtin.slurp:
        src: /var/lib/samba/private/tls/ca.pem
      register: samba_ca

- name: mgmt01 - self-service portal
  hosts: mgmt01
  vars:
    src: "{{ playbook_dir }}/../mgmt01/portal"
  tasks:
    - name: Portal config directory
      ansible.builtin.file:
        path: /etc/lab-portal
        state: directory
        mode: "0755"

    - name: Samba's CA, for LDAPS to dc01
      ansible.builtin.copy:
        content: "{{ hostvars['dc01'].samba_ca.content | b64decode }}"
        dest: /etc/lab-portal/samba-ca.pem
        mode: "0644"

    - name: LDAP client for the admin sign-in
      ansible.builtin.apt:
        name: python3-ldap3
        state: present

    # Signs the admin session cookie. Created once; rotating it signs everyone out.
    - name: Session key (created once)
      ansible.builtin.shell: |
        umask 027
        openssl rand -hex 32 > /etc/lab-portal/session-key
        chgrp labportal /etc/lab-portal/session-key
      args:
        creates: /etc/lab-portal/session-key

    - name: Unprivileged user for the web side
      ansible.builtin.user:
        name: labportal
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    # requests/  web writes, worker reads and deletes
    # passwords/ web creates (O_EXCL reservation), worker and Ansible read
    # machines/  worker writes, web reads (setgid: files inherit group labportal)
    - name: State directories
      ansible.builtin.file:
        path: "/var/lib/lab-portal/{{ item.name }}"
        state: directory
        owner: root
        group: labportal
        mode: "{{ item.mode }}"
      loop:
        - { name: "", mode: "0750" }
        - { name: requests, mode: "0770" }
        - { name: passwords, mode: "0770" }
        - { name: machines, mode: "2750" }

    - name: Log directory
      ansible.builtin.file:
        path: /var/log/lab-portal
        state: directory
        mode: "0750"

    - name: Program files
      ansible.builtin.copy:
        src: "{{ src }}/{{ item }}"
        dest: /usr/local/lib/lab-portal/
        mode: "0755"
      loop: [portal.py, portal.html, admin.html, worker.py]
      notify: Restart portal

    - name: systemd units
      ansible.builtin.copy:
        src: "{{ src }}/{{ item }}"
        dest: /etc/systemd/system/
        mode: "0644"
      loop: [lab-portal.service, lab-portal-worker.service]
      notify: Restart portal

    # ------------------------------------------------ certificate (HTTPS everywhere)
    # Let's Encrypt for lab.radicallydecent.com by DNS-01 through acme-dns on the VPS
    # (vps/README.md). The account in /etc/lab-portal/acme-dns/lab.json can only set
    # that name's challenge record; it is copied here by hand, never committed.
    - name: certbot
      ansible.builtin.apt:
        name: certbot
        state: present

    - name: acme-dns hook
      ansible.builtin.copy:
        src: "{{ src }}/certbot-acme-dns-hook"
        dest: /usr/local/sbin/certbot-acme-dns-hook
        mode: "0755"

    - name: Its settings (acme-dns API on the VPS, account directory)
      ansible.builtin.copy:
        content: |
          ACMEDNS_API=https://acme-ns.radicallydecent.com
          ACMEDNS_ACCOUNTS=/etc/lab-portal/acme-dns
        dest: /etc/default/certbot-acme-dns
        mode: "0644"

    - name: The acme-dns account must be in place
      ansible.builtin.stat:
        path: /etc/lab-portal/acme-dns/lab.json
      register: lab_acct
      failed_when: not lab_acct.stat.exists

    - name: Certificate for lab.radicallydecent.com (certbot.timer renews it)
      ansible.builtin.command: >-
        certbot certonly --non-interactive --agree-tos --email jesse@radicallydecent.com
        --manual --preferred-challenges dns
        --manual-auth-hook /usr/local/sbin/certbot-acme-dns-hook
        --deploy-hook "systemctl reload nginx"
        --cert-name lab.radicallydecent.com -d lab.radicallydecent.com
      args:
        creates: /etc/letsencrypt/live/lab.radicallydecent.com/fullchain.pem

    # ------------------------------------------------ nginx: HTTPS sites, HTTP for the ISO only
    - name: nginx snippets and sites
      ansible.builtin.copy:
        src: "{{ src }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: nginx-lab-tls.conf, dest: /etc/nginx/snippets/lab-tls.conf }
        - { src: nginx-lab-limits.conf, dest: /etc/nginx/conf.d/lab-limits.conf }
        - { src: nginx-lab-portal-locations.conf, dest: /etc/nginx/snippets/lab-portal-locations.conf }
        - { src: nginx-lab-events.conf, dest: /etc/nginx/snippets/lab-events.conf }
        - { src: nginx-lab-portal.conf, dest: /etc/nginx/sites-available/lab-portal }
        - { src: nginx-lab-boot.conf, dest: /etc/nginx/sites-available/lab-boot }
      notify: Reload nginx

    - name: Enable the HTTPS site and the ISO-only HTTP site
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ item }}"
        dest: "/etc/nginx/sites-enabled/{{ item }}"
        state: link
      loop: [lab-portal, lab-boot]
      notify: Reload nginx

    - name: Retire the old plain-HTTP default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: PXE boot menu (install records over HTTPS)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../mgmt01/tftp-grub.cfg"
        dest: /srv/tftp/grub/grub.cfg
        mode: "0644"

    # ------------------------------------------------ Apache Guacamole (Connect button)
    # Docker in this unprivileged container needs the LXC features nesting=1,keyctl=1
    # (set on pve01: pct set 106 --features nesting=1,keyctl=1).
    - name: Docker, Compose, and AES for the portal's signed logins
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, python3-cryptography]
        state: present

    - name: Config directory
      ansible.builtin.file:
        path: /etc/lab-portal/guacamole
        state: directory
        mode: "0755"

    # Shared secret for Guacamole's JSON auth: 128 bits as 32 hex digits. Created once;
    # the portal (group labportal) signs with it, the container reads it from the env file.
    - name: JSON auth key (created once)
      ansible.builtin.shell: |
        umask 027
        openssl rand -hex 16 > /etc/lab-portal/json-secret-key
        chgrp labportal /etc/lab-portal/json-secret-key
      args:
        creates: /etc/lab-portal/json-secret-key

    - name: Read the key
      ansible.builtin.slurp:
        src: /etc/lab-portal/json-secret-key
      register: json_key
      no_log: true

    - name: Guacamole's environment file
      ansible.builtin.copy:
        content: "JSON_SECRET_KEY={{ json_key.content | b64decode | trim }}\n"
        dest: /etc/lab-portal/guacamole.env
        mode: "0600"
      no_log: true
      notify: Recreate Guacamole

    - name: Compose file
      ansible.builtin.copy:
        src: "{{ src }}/guacamole-compose.yml"
        dest: /etc/lab-portal/guacamole/compose.yml
        mode: "0644"
      notify: Recreate Guacamole

    - name: Guacamole running
      ansible.builtin.command: docker compose -f /etc/lab-portal/guacamole/compose.yml up -d
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"

    - name: Start both services at boot
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: [lab-portal, lab-portal-worker]

  handlers:
    - name: Restart portal
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
        daemon_reload: true
      loop: [lab-portal, lab-portal-worker]

    - name: Reload nginx
      ansible.builtin.shell: nginx -t && systemctl reload nginx

    # Docker reads environment variables only when a container is created
    - name: Recreate Guacamole
      ansible.builtin.command: docker compose -f /etc/lab-portal/guacamole/compose.yml up -d --force-recreate

# The portal's name resolves to mgmt01 inside the lab, so lab machines (and installers)
# use the same HTTPS name and certificate as visitors on the internet, where the name
# points at the VPS.
- name: dc01 - lab.radicallydecent.com inside the lab
  hosts: dc01
  tasks:
    - name: Zone lab.radicallydecent.com in AD DNS
      ansible.builtin.shell: |
        samba-tool dns zonelist 127.0.0.1 -P | grep -q "pszZoneName *: lab.radicallydecent.com$" && exit 0
        samba-tool dns zonecreate 127.0.0.1 lab.radicallydecent.com -P && echo created
      register: zone
      changed_when: "'created' in zone.stdout"

    - name: lab.radicallydecent.com -> mgmt01
      ansible.builtin.shell: |
        samba-tool dns query 127.0.0.1 lab.radicallydecent.com @ A -P 2>/dev/null | grep -q "A: 10.10.10.6" && exit 0
        samba-tool dns add 127.0.0.1 lab.radicallydecent.com @ A 10.10.10.6 -P && echo added
      register: rec
      changed_when: "'added' in rec.stdout"
