# ansible-pull runs local.yml by default. Each workstation applies this to itself.
- name: Configure this workstation
  hosts: localhost
  connection: local
  roles:
    - base
    - ad_join
  tasks:
    # The ad_join role sets ad_groups: the AD groups this computer account belongs to.
    # Every "role-<name>" group maps to roles/<name>.
    - name: Apply the roles AD assigns to this computer
      ansible.builtin.include_role:
        name: "{{ item | regex_replace('^role-', '') }}"
      loop: "{{ ad_groups | default([]) | select('match', '^role-') | list }}"

  post_tasks:
    # Only reached when the whole run succeeded. The self-service portal on mgmt01
    # reads this request from its nginx log to know a guest machine is ready.
    - name: Tell mgmt01 this configuration run finished
      ansible.builtin.uri:
        url: https://lab.radicallydecent.com/lab-events/configured
        status_code: [204, 404]   # 404 until the portal is installed
      changed_when: false
      failed_when: false
