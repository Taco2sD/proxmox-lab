- name: Packages for AD membership (adcli joins, SSSD handles logins, ldap-utils for the fact)
  ansible.builtin.apt:
    # bind9-dnsutils: dig/host/nsupdate for troubleshooting. (Clients don't register
    # DNS themselves; the DHCP server on dc01 does.)
    name: [adcli, sssd-ad, sssd-tools, krb5-user, libnss-sss, libpam-sss, ldap-utils,
           libsasl2-modules-gssapi-mit, bind9-dnsutils]
    state: present

- name: Kerberos client config (finds the KDC through DNS SRV records)
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    mode: "0644"

# ---- Join (only once) -------------------------------------------------------

- name: Are we joined? (the keytab holds our machine principal after a join)
  ansible.builtin.command: klist -k /etc/krb5.keytab
  register: keytab
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe: run it even in --check, or dry runs think we're not joined

- name: Join the domain with the pre-staged one-time password
  when: ((ansible_facts.hostname | upper) ~ '$@' ~ ad_realm) not in keytab.stdout
  block:
    - name: Look for the one-time password dropped at provisioning time
      ansible.builtin.stat:
        path: /etc/ad-join-otp
      register: otp_file

    - name: Stop with a clear message if there is nothing to join with
      ansible.builtin.fail:
        msg: >-
          Not joined and no /etc/ad-join-otp. Pre-stage the computer on the DC
          (adcli preset-computer --one-time-password=...) and put that password in
          /etc/ad-join-otp (mode 600).
      when: not otp_file.stat.exists

    - name: Read the one-time password
      ansible.builtin.slurp:
        src: /etc/ad-join-otp
      register: otp
      no_log: true

    - name: Join (sets the machine's own password, writes /etc/krb5.keytab, registers SPNs)
      ansible.builtin.command:
        argv:
          - adcli
          - join
          - --domain={{ ad_domain }}
          - --host-fqdn={{ ansible_facts.hostname }}.{{ ad_domain }}
          - --one-time-password={{ otp.content | b64decode | trim }}
      no_log: true

    - name: Remove the one-time password (already used up; nothing secret should linger)
      ansible.builtin.file:
        path: /etc/ad-join-otp
        state: absent

# ---- Which roles does AD give this machine? ---------------------------------

- name: Directory for local facts (Ansible runs every executable here during fact gathering)
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    mode: "0755"

- name: Local fact that asks AD which groups this computer belongs to
  ansible.builtin.template:
    src: ad.fact.j2
    dest: /etc/ansible/facts.d/ad.fact
    mode: "0755"

# Run the lookup directly instead of relying on Ansible's local-facts refresh:
# a fresh answer right after a join, identical in --check runs, one source of truth.
# (The script stays in facts.d too, so `ansible -m setup` shows it for ad-hoc checks.)
- name: Ask AD which groups this computer belongs to (as the machine account)
  ansible.builtin.command: /etc/ansible/facts.d/ad.fact
  register: ad_lookup
  changed_when: false
  # 3: joined but AD unreachable (ad.fact). Anything else, e.g. a --check run on a
  # not-yet-joined machine with no script yet, falls back to an empty answer.
  failed_when: ad_lookup.rc == 3
  check_mode: false   # read-only

- name: Remember the answer for the rest of the play (role selection in local.yml)
  ansible.builtin.set_fact:
    ad_answer: "{{ ((ad_lookup.stdout | default('', true)) or '{}') | from_json }}"

- name: This machine's role groups, and its owner if it's a guest machine
  ansible.builtin.set_fact:
    ad_groups: "{{ ad_answer.groups | default([]) }}"
    # A guest machine's owner is the computer account's managedBy in AD (set by
    # roles/dc_identity from the portal's record): the only regular user who may log in.
    guest_owner: "{{ ad_answer.owner | default('') }}"

- name: The catalogue (catalog/*.yml in this machine's checkout of the repository)
  ansible.builtin.set_fact:
    catalog: >-
      {{ catalog | default({}) | combine({(item | basename | regex_replace('\.yml$', '')):
         (lookup('ansible.builtin.file', item) | from_yaml)}) }}
  loop: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/../catalog/*.yml') }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Work out which AD user groups may log in here
  ansible.builtin.set_fact:
    # Guest machines: only the owner (simple_allow_users) and the admins.
    # Fleet machines: the admins plus the login groups of each catalog/ entry AD
    # assigns this machine (role-artist -> catalog/artist.yml: login_groups).
    ad_login_groups: >-
      {{ ad_admin_groups if guest_owner else
         ad_admin_groups
         + (ad_groups | select('match', '^role-') | map('regex_replace', '^role-', '')
            | select('in', catalog) | map('extract', catalog) | map(attribute='login_groups') | flatten) }}

# ---- Logins -----------------------------------------------------------------

- name: SSSD config (RFC2307 IDs from AD, only allowed groups may log in)
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    # Match what sssd.service enforces on every start (it runs as user sssd and
    # chowns root:sssd + g+r). Writing 0600 here would cause a change on every
    # run, and a needless SSSD restart every 30 minutes.
    owner: root
    group: sssd
    mode: "0640"
  notify: Restart sssd

- name: SSSD running
  ansible.builtin.systemd_service:
    name: sssd
    enabled: true
    state: started

# Ubuntu's sssd package (2.12) also enables socket activation for the nss, pam and pac
# responders (sssd-nss.socket and friends, WantedBy=sssd.service). sssd.conf above has
# SSSD's own monitor start them instead ("services = nss, pam"; the AD provider adds
# pac), and SSSD refuses to run a responder both ways: each socket's ExecStartPre
# (sssd_check_socket_activated_responders) exits 17 with "Misconfiguration found for
# the 'nss' responder", leaving three failed units on every workstation
# (docs/kb/issues/KB-0002-sssd-responder-sockets-failed.md).
# Masking the sockets keeps logins exactly as they have always worked (the
# monitor-started responders serve NSS, PAM and the PAC); dropping "services =" for
# socket activation would change how every login reaches SSSD for no gain on a machine
# with a handful of users. The sudo, ssh and autofs sockets aren't in "services =", so
# they stay socket-activated and healthy.
- name: Turn off the responder sockets SSSD already runs itself (nss, pam, pac)
  ansible.builtin.systemd_service:
    name: "sssd-{{ item }}.socket"
    masked: true
  loop: [nss, pam, pac]

# A masked unit keeps its "failed" state until it is reset; only reset when one is
# still marked failed, so this reports no change on every other run
- name: Clear the sockets' old failures  # noqa: command-instead-of-module (the systemd module has no reset-failed)
  ansible.builtin.shell: |
    systemctl is-failed --quiet sssd-nss.socket sssd-pam.socket sssd-pac.socket || exit 0
    systemctl reset-failed sssd-nss.socket sssd-pam.socket sssd-pac.socket
    echo cleared
  register: sssd_sockets_reset
  changed_when: "'cleared' in sssd_sockets_reset.stdout"

- name: Is home-directory creation on first login enabled?
  ansible.builtin.command: grep -q pam_mkhomedir /etc/pam.d/common-session
  register: mkhomedir
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe

- name: Create home directories on first login
  ansible.builtin.command: pam-auth-update --enable mkhomedir
  when: mkhomedir.rc != 0

- name: People's SSH keys come from mgmt01 (the key they gave on the welcome page)
  ansible.builtin.copy:
    dest: /usr/local/libexec/lab-authorized-keys
    content: |
      #!/bin/sh
      # Managed by Ansible (ad_join role). sshd runs this as "nobody" for every key login
      # (AuthorizedKeysCommand) and accepts the keys it prints: the person's public key
      # from https://{{ lab_fqdn }}/keys/<user> (roles/lab_web: lab-keys.conf). Unknown
      # users get nothing back, and sshd still reads ~/.ssh/authorized_keys as usual.
      case "$1" in *[!a-z0-9]* | "") exit 0 ;; esac
      exec curl -fsS --max-time 5 "https://{{ lab_fqdn }}/keys/$1"
    mode: "0755"

- name: Ask mgmt01 for those keys on every key login (sshd)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-lab-keys.conf
    content: |
      # Managed by Ansible (ad_join role): see /usr/local/libexec/lab-authorized-keys
      AuthorizedKeysCommand /usr/local/libexec/lab-authorized-keys %u
      AuthorizedKeysCommandUser nobody
    mode: "0644"
  notify: Reload sshd

- name: Password SSH logins only from mgmt01 (Guacamole), keys only for everyone else
  ansible.builtin.copy:
    # 99- so it is read last: a Match block captures every directive after it, and
    # cloud-init's global "PasswordAuthentication no" must stay outside the block.
    dest: /etc/ssh/sshd_config.d/99-guacamole.conf
    content: |
      # Managed by Ansible (ad_join role)
      Match Address {{ mgmt01_ip }}
          PasswordAuthentication yes
    mode: "0644"
  notify: Reload sshd

- name: Grant sudo to workstation admins
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ad-admins
    content: |
      # Managed by Ansible (ad_join role)
      {% for g in ad_admin_groups %}
      %{{ g }} ALL=(ALL:ALL) ALL
      {% endfor %}
    mode: "0440"
    validate: visudo -cf %s
