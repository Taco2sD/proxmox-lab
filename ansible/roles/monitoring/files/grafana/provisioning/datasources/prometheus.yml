# Grafana's data source (roles/monitoring): Prometheus on the same host. Provisioned
# from this file, so it can't be changed in Grafana's UI (and a rebuilt Grafana has it).
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090/prometheus
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s      # the scrape interval: Grafana's $__rate_interval builds on it
      prometheusType: Prometheus
