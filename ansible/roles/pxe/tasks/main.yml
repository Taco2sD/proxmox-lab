# mgmt01: network installs. The boot menu (TFTP), the install records (HTTPS, served by
# roles/lab_web from /var/www/lab/autoinstall), and the installer ISO (plain HTTP,
# lab-boot.conf). Part of ansible/site.yml.
#
# One install record today: the golden image builder's (image-user-data.yaml.j2 explains
# the build). Workstations themselves are clones and never network-boot.

- name: PXE boot menu
  ansible.builtin.template:
    src: grub.cfg.j2
    dest: /srv/tftp/grub/grub.cfg
    mode: "0644"

# One install record per kind of golden image (ansible/group_vars/all.yml: images):
# lab-image-headless, lab-image-desktop. The desktop one bakes in the desktop and every
# desktop role's packages, so those clones install nothing on first boot.
- name: Packages of the desktop roles (catalog/*.yml with kind desktop), for the desktop image
  ansible.builtin.set_fact:
    pxe_desktop_role_packages: >-
      {{ (pxe_desktop_role_packages | default([])
          + (pxe_role.packages if pxe_role.kind == 'desktop' else [])) | unique | sort }}
  loop: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/../catalog/*.yml') }}"
  loop_control:
    label: "{{ item | basename }}"
  vars:
    pxe_role: "{{ lookup('ansible.builtin.file', item) | from_yaml }}"

- name: Install record directories, one per image kind
  ansible.builtin.file:
    path: "/var/www/lab/autoinstall/{{ image_builder.name }}-{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ images | list }}"

- name: The image builder's autoinstall (user-data), per image kind
  ansible.builtin.template:
    src: image-user-data.yaml.j2
    dest: "/var/www/lab/autoinstall/{{ image_builder.name }}-{{ image_kind }}/user-data"
    mode: "0644"
  loop: "{{ images | list }}"
  loop_control:
    loop_var: image_kind
  vars:
    pxe_admin_hash: "{{ lookup('ansible.builtin.file', pxe_admin_hash_file) | trim }}"
    pxe_admin_key: "{{ lookup('ansible.builtin.file', pxe_admin_key_file) | trim }}"
    pxe_packages: >-
      {{ image_packages + ((desktop_packages + pxe_desktop_role_packages) if image_kind == 'desktop' else []) }}

- name: Write meta-data too (the NoCloud datasource wants both files)
  ansible.builtin.copy:
    content: "instance-id: {{ image_builder.name }}-{{ item }}\n"
    dest: "/var/www/lab/autoinstall/{{ image_builder.name }}-{{ item }}/meta-data"
    mode: "0644"
  loop: "{{ images | list }}"

# GRUB asks for /autoinstall/<its MAC>/ (${net_default_mac}, lower case with colons).
# That link is `lab image build`'s to point at the record of the kind it builds; this
# only creates it on a new mgmt01, and retires the single record from before.
- name: Is the builder's MAC link there?
  ansible.builtin.stat:
    path: "/var/www/lab/autoinstall/{{ image_builder.mac | lower }}"
    follow: true
  register: pxe_mac_link

- name: The builder's MAC address leads to a record (only when missing or dangling)
  ansible.builtin.file:
    src: "{{ image_builder.name }}-headless"
    dest: "/var/www/lab/autoinstall/{{ image_builder.mac | lower }}"
    state: link
    force: true
  when: not pxe_mac_link.stat.exists

- name: Retire the single install record from before there were two kinds
  ansible.builtin.file:
    path: "/var/www/lab/autoinstall/{{ image_builder.name }}"
    state: absent

- name: The ISO-only plain-HTTP site
  ansible.builtin.copy:
    src: lab-boot.conf
    dest: /etc/nginx/sites-available/lab-boot
    mode: "0644"
  notify: Reload nginx

- name: Enable it
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lab-boot
    dest: /etc/nginx/sites-enabled/lab-boot
    state: link
  notify: Reload nginx

# Per-workstation install records from before the golden image (ws03, ws04, their MAC
# links, the template they were made from). Clones don't need them.
- name: Retire the old per-workstation install records
  ansible.builtin.file:
    path: /var/www/html/autoinstall
    state: absent
