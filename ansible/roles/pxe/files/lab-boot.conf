# /etc/nginx/sites-enabled/lab-boot on mgmt01 (roles/pxe): the only plain-HTTP service in
# the lab. GRUB and the installer's initramfs fetch the Ubuntu ISO before any TLS client
# exists (grub.cfg.j2). It's a public image with no secrets; everything else is HTTPS
# (roles/lab_web), and this server answers 404 for anything but an ISO.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;

    location ~ ^/[^/]+\.iso$ {
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
