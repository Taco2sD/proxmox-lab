# pve01: a Proxmox API token for the portal (mgmt01) that can open VM consoles and do
# nothing else. My lab's Desktop button opens a workstation's own screen (the Ubuntu
# login, then the GNOME desktop) in the browser: the portal asks Proxmox for a one-time
# VNC ticket (vncproxy, generate-password) and hands it to Guacamole, which connects to
# pve01 within seconds. The portal checks that the person owns the machine first.
#
# Least privilege: role LabConsole = VM.Console only. OpenTofu's token (root-only on
# mgmt01) stays where it is; the web side never sees it.
# The secret is only shown when the token is created: it goes straight to mgmt01
# (/etc/lab-portal/console-token, readable by the portal's user only).

- name: Role with the console privilege only
  ansible.builtin.command: pveum role add LabConsole --privs VM.Console
  register: console_role
  changed_when: console_role.rc == 0
  failed_when: console_role.rc != 0 and 'already exists' not in console_role.stderr

- name: The portal's API user
  ansible.builtin.command: >-
    pveum user add portal@pve --comment "Lab portal - VM consoles only (roles/pve_console)"
  register: console_user
  changed_when: console_user.rc == 0
  failed_when: console_user.rc != 0 and 'already exists' not in console_user.stderr

- name: May open consoles of VMs
  ansible.builtin.command: pveum acl modify /vms --users portal@pve --roles LabConsole
  changed_when: false

- name: Does mgmt01 have the token?
  ansible.builtin.stat:
    path: /etc/lab-portal/console-token
  delegate_to: mgmt01
  become: false
  register: console_token_file

- name: New token (only when mgmt01 lacks it; an old one is replaced)
  ansible.builtin.shell: |
    pveum user token remove portal@pve console 2>/dev/null || true
    pveum user token add portal@pve console --privsep 0 --output-format json
  register: console_token
  when: not console_token_file.stat.exists
  changed_when: true
  no_log: true

- name: Hand the token to the portal (mgmt01)
  ansible.builtin.copy:
    content: "PVEAPIToken=portal@pve!console={{ (console_token.stdout | from_json).value }}\n"
    dest: /etc/lab-portal/console-token
    owner: root
    group: labportal
    mode: "0640"
  delegate_to: mgmt01
  become: false
  when: not console_token_file.stat.exists
  no_log: true
