# AD computer accounts in OU=Workstations, one per inventory entry, each in exactly
# one role-* group. Runs on dc01 as root, so samba-tool works on the local database
# without separate credentials.
#
# The account outlives reimages (that's where the role lives); only `lab prune`
# (-e prune=true) deletes accounts that left the inventory.

- name: Computer accounts that exist in OU=Workstations
  ansible.builtin.command: >-
    ldbsearch -H /var/lib/samba/private/sam.ldb
    -b "OU=Workstations,OU=Lab,{{ ad_base_dn }}" "(objectClass=computer)" sAMAccountName
  register: ou_search
  changed_when: false
  check_mode: false

- name: Remember them (lower-case names, without the trailing $)
  ansible.builtin.set_fact:
    existing_accounts: "{{ ou_search.stdout | regex_findall('sAMAccountName: (\\S+)\\$') | map('lower') | list }}"

- name: Pre-stage missing computer accounts
  ansible.builtin.command:
    argv: [samba-tool, computer, add, "{{ item }}", "--computerou=OU=Workstations,OU=Lab"]
  loop: "{{ workstations.keys() | list | difference(existing_accounts) }}"

- name: Current members of each role group
  ansible.builtin.command: samba-tool group listmembers {{ item }}
  loop: "{{ role_login_groups.keys() | list }}"
  register: role_listing
  changed_when: false
  check_mode: false

- name: Remember them as a group -> members map
  ansible.builtin.set_fact:
    role_members: >-
      {{ dict(role_listing.results | map(attribute='item')
              | zip(role_listing.results | map(attribute='stdout_lines') | map('map', 'lower'))) }}

- name: Add each workstation to its role group
  ansible.builtin.command:
    argv: [samba-tool, group, addmembers, "role-{{ item.value.role }}", "{{ item.key }}$"]
  loop: "{{ workstations | dict2items }}"
  loop_control:
    label: "{{ item.key }} -> role-{{ item.value.role }}"
  when: (item.key ~ '$') not in (role_members['role-' ~ item.value.role] | default([]))

- name: Remove workstations from role groups they no longer belong to
  ansible.builtin.command:
    argv: [samba-tool, group, removemembers, "{{ item.0.key }}", "{{ item.1 }}"]
  loop: "{{ role_members | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.1 }} out of {{ item.0.key }}"
  when: >-
    ('role-' ~ (workstations[item.1 | regex_replace('\$$', '')].role | default('none')))
    != item.0.key

- name: Delete accounts of workstations no longer in the inventory (lab prune only)
  ansible.builtin.command:
    argv: [samba-tool, computer, delete, "{{ item }}"]
  loop: "{{ existing_accounts | difference(workstations.keys() | list) }}"
  when: prune | default(false) | bool
