- name: Common tools (ansible-core + git keep this machine self-managing)
  ansible.builtin.apt:
    name: [vim, htop, curl, git, ansible-core]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Take time from the domain controller (Kerberos tolerates 5 min skew)
  ansible.builtin.copy:
    dest: /etc/chrony/sources.d/ad.sources
    content: "server {{ ad_dc }} iburst prefer\n"
    mode: "0644"
  notify: Reload chrony sources

- name: VMs can be frozen with their host; let chrony step big errors any time
  ansible.builtin.copy:
    dest: /etc/chrony/conf.d/vm-makestep.conf
    content: "makestep 1 -1\n"
    mode: "0644"
  notify: Restart chrony

- name: Stop using Ubuntu's public NTP pools
  ansible.builtin.file:
    path: /etc/chrony/sources.d/ubuntu-ntp-pools.sources
    state: absent
  notify: Reload chrony sources

# systemd's profile script prints OSC 3008 "context" escape codes around every prompt.
# Terminals that don't know them show them as text: Guacamole's browser terminal
# fills up with "start=...;machineid=...;user=..." on every Enter. dpkg-divert moves
# the file aside in a way package upgrades respect, so it stays off.
- name: Turn off systemd's OSC 3008 prompt codes (garble the browser terminal)
  ansible.builtin.command: >-
    dpkg-divert --local --rename
    --divert /etc/profile.d/80-systemd-osc-context.sh.disabled
    --add /etc/profile.d/80-systemd-osc-context.sh
  register: osc_divert
  changed_when: "'Adding' in osc_divert.stdout"

- name: Activity beacon (someone is connected over SSH or RDP)
  ansible.builtin.copy:
    dest: /usr/local/libexec/lab-activity
    content: |
      #!/bin/sh
      # Managed by Ansible (base role). Run every five minutes by lab-activity.timer:
      # while anyone is connected (an SSH or RDP connection, including the browser
      # terminal and desktop through Guacamole), tell mgmt01. The portal's worker
      # hibernates staff machines that haven't reported for idle_hibernate_minutes
      # (ansible/group_vars/all.yml); they resume exactly where they were.
      if [ -n "$(ss -Htn state established '( sport = :22 or sport = :3389 )')" ]; then
          exec curl -fsS -o /dev/null --max-time 10 "https://{{ lab_fqdn }}/lab-events/active"
      fi
    mode: "0755"

- name: Activity beacon units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: lab-activity.service
      content: |
        # Managed by Ansible (base role): see /usr/local/libexec/lab-activity
        [Unit]
        Description=Tell mgmt01 whether anyone is connected
        [Service]
        Type=oneshot
        ExecStart=/usr/local/libexec/lab-activity
    - name: lab-activity.timer
      content: |
        # Managed by Ansible (base role)
        [Unit]
        Description=Report sessions to mgmt01 every five minutes
        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=5min
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: activity_units

- name: Activity beacon timer running
  ansible.builtin.systemd_service:
    name: lab-activity.timer
    enabled: true
    state: started
    daemon_reload: "{{ activity_units.changed }}"

- name: Install the ansible-pull service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [ansible-pull.service, ansible-pull.timer]
  notify: Reload systemd

- name: Make systemd see new units before enabling them
  ansible.builtin.meta: flush_handlers

- name: Run ansible-pull on a schedule
  ansible.builtin.systemd_service:
    name: ansible-pull.timer
    enabled: true
    state: started
