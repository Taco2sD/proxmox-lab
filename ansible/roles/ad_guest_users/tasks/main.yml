# AD accounts for the owners of guest machines (inventory/guests/*.yml), in their own
# OU. They are deliberately NOT added to role groups (artists, programmers): those
# grant logins on every machine of that role. A guest's own machine admits them by
# name instead (simple_allow_users, see the ad_join role).
#
# Passwords never touch git: the portal writes them to guest_password_dir on mgmt01
# (the Ansible controller), and lookups run there.

- name: Guest machines and their owners
  ansible.builtin.set_fact:
    guest_owners: >-
      {{ workstations | dict2items | selectattr('value.owner', 'defined')
         | map(attribute='value') | list }}

- name: Does OU=Guests exist?
  ansible.builtin.command: >-
    ldbsearch -H /var/lib/samba/private/sam.ldb -s base
    -b "OU=Guests,OU=Lab,{{ ad_base_dn }}" dn
  register: guests_ou
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create OU=Guests
  ansible.builtin.command: samba-tool ou create "OU=Guests,OU=Lab"
  when: "'dn: ' not in guests_ou.stdout"

- name: Users that exist in OU=Guests
  ansible.builtin.command: >-
    ldbsearch -H /var/lib/samba/private/sam.ldb
    -b "OU=Guests,OU=Lab,{{ ad_base_dn }}" "(objectClass=user)" sAMAccountName
  register: guests_search
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remember them
  ansible.builtin.set_fact:
    existing_guests: "{{ guests_search.stdout | regex_findall('sAMAccountName: (\\S+)') | map('lower') | list }}"

- name: Create missing guest users (RFC2307 IDs from the machine's slot)
  ansible.builtin.command:
    argv:
      - samba-tool
      - user
      - create
      - "{{ item.owner }}"
      - "{{ lookup('ansible.builtin.file', guest_password_dir ~ '/' ~ item.owner, errors='ignore')
            or lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=20) }}"
      - --userou=OU=Guests,OU=Lab
      - --given-name={{ item.owner }}
      - --surname=Guest
      - --nis-domain=lab
      - --uid-number={{ 20100 + (item.vmid | int) - 130 }}
      - --gid-number=10000
      - --unix-home=/home/{{ item.owner }}
      - --login-shell=/bin/bash
  loop: "{{ guest_owners }}"
  loop_control:
    label: "{{ item.owner }}"
  when: item.owner | lower not in existing_guests
  no_log: true

- name: Delete guest users whose machine left the inventory (lab prune only)
  ansible.builtin.command:
    argv: [samba-tool, user, delete, "{{ item }}"]
  loop: "{{ existing_guests | difference(guest_owners | map(attribute='owner') | map('lower') | list) }}"
  when: prune | default(false) | bool
