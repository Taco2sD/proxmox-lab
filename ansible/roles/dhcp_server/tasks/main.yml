# dc01: dnsmasq as the lab's DHCP server, and the hook that registers every lease in AD
# DNS (files/dhcp-dns-update). Part of ansible/site.yml. Workstations' reservations
# aren't here: roles/dc_identity writes one file per machine into /etc/dnsmasq-hosts.d.

- name: Tools (dhcp_release, used by roles/dc_identity when a machine is removed)
  ansible.builtin.apt:
    name: dnsmasq-utils
    state: present

- name: Per-machine reservations directory (dhcp-hostsdir)
  ansible.builtin.file:
    path: /etc/dnsmasq-hosts.d
    state: directory
    mode: "0755"

- name: DHCP -> DNS hook
  ansible.builtin.copy:
    src: dhcp-dns-update
    dest: /usr/local/sbin/dhcp-dns-update
    mode: "0755"

- name: DHCP configuration
  ansible.builtin.template:
    src: lab-dhcp.conf.j2
    dest: /etc/dnsmasq.d/lab-dhcp.conf
    mode: "0644"
    validate: dnsmasq --test --conf-file=%s
  notify: Restart dnsmasq

# Before per-machine files, all workstation reservations were one generated file
- name: Retire the old all-in-one reservations file
  ansible.builtin.file:
    path: /etc/dnsmasq.d/lab-workstations.conf
    state: absent
  notify: Restart dnsmasq
