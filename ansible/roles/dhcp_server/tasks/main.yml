# dnsmasq on dc01: DHCP for the lab, plus the hook that registers clients in AD DNS.
# The base config and the hook script come from dc01/ in this repo; the workstation
# reservations are generated from the inventory.

- name: Base DHCP config (dc01/lab-dhcp.conf)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../dc01/lab-dhcp.conf"
    dest: /etc/dnsmasq.d/lab-dhcp.conf
    mode: "0644"
    validate: dnsmasq --test --conf-file=%s
  notify: Restart dnsmasq

- name: DHCP -> DNS update hook (dc01/dhcp-dns-update)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../dc01/dhcp-dns-update"
    dest: /usr/local/sbin/dhcp-dns-update
    mode: "0755"

- name: Workstation reservations from inventory/workstations.yml
  ansible.builtin.template:
    src: lab-workstations.conf.j2
    dest: /etc/dnsmasq.d/lab-workstations.conf
    mode: "0644"
    validate: dnsmasq --test --conf-file=%s
  notify: Restart dnsmasq
