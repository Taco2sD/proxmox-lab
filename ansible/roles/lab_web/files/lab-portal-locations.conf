# /etc/nginx/snippets/lab-portal-locations.conf on mgmt01, deployed by roles/lab_web:
# the portal (roles/portal: portal.py on 127.0.0.1:8090), Apache Guacamole
# (roles/guacamole, 127.0.0.1:8085) and the monitoring (roles/monitoring: Grafana on
# 127.0.0.1:3000, Prometheus on 127.0.0.1:9090), shared by the lab-facing (443) and
# internet-facing (8443) servers in lab-portal.conf.
client_max_body_size 8k;

location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Admin sign-in: rate-limited (lab-limits.conf)
location = /api/admin/login {
    limit_req zone=admin_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# The same for staff sign-ins and sign-ups (the welcome page), which check passwords
# or sign-up links
location ~ ^/api/(me/login|welcome/signup)$ {
    limit_req zone=admin_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Apache Guacamole (roles/guacamole), as in Guacamole's manual: no buffering,
# WebSocket upgrade. No access log: the login link carries the encrypted credentials.
location /guacamole/ {
    proxy_pass http://127.0.0.1:8085;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 1h;
    client_max_body_size 64m;
    access_log off;
}

# Grafana (roles/monitoring), served from /grafana/ (GF_SERVER_SERVE_FROM_SUB_PATH), so
# the path is passed on as it is. Its queries are POSTs bigger than the portal's 8k
# limit; Grafana Live (dashboards updating as data arrives) is a WebSocket.
location /grafana/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    client_max_body_size 4m;
}

# Prometheus's own pages (targets, service discovery, alerts, ad-hoc queries), served
# from /prometheus/ (--web.external-url). Read-only: its admin and lifecycle APIs are off.
location /prometheus/ {
    proxy_pass http://127.0.0.1:9090;
    proxy_set_header Host $host;
    client_max_body_size 256k;
}
