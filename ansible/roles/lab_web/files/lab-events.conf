# /etc/nginx/snippets/lab-events.conf on mgmt01, deployed by roles/lab_web; included in
# the lab-facing server only (lab-portal.conf, port 443).
#
# Workstations request /lab-events/configured at the end of every successful
# configuration run (ansible/local.yml). There's nothing to serve: the request itself is
# the message. It goes to its own log (lab-events-log.conf), which the portal's worker
# follows: a guest machine's first one means it's ready; every one updates the admin
# page's "last configured".
location /lab-events/ {
    access_log /var/log/nginx/lab-events.log lab_events;
    return 204;
}
