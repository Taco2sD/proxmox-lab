# /etc/nginx/conf.d/lab-events-log.conf on mgmt01 (http context), deployed by roles/lab_web.
#
# The log format of /var/log/nginx/lab-events.log: one JSON object per line, written
# only by the locations workstations report through (lab-events.conf, lab-otp.conf).
# The portal's worker parses it (lablib.parse_event); a separate log means its format
# and contents never depend on the main access log. Debian's nginx logrotate config
# (/var/log/nginx/*.log) rotates it; the worker follows rotations.
log_format lab_events escape=json '{"time":"$time_iso8601","ip":"$remote_addr","uri":"$uri","status":$status}';
