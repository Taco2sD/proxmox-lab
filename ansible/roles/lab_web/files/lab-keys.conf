# /etc/nginx/snippets/lab-keys.conf on mgmt01, deployed by roles/lab_web; included in
# the lab-facing server only (lab-portal.conf, port 443), never the internet-facing one.
#
# People's SSH public keys, one file per user (/var/www/lab/keys/<user>, written by the
# portal's worker from the key someone pasted on the welcome page). Every workstation's
# sshd asks for the key of whoever is logging in (roles/ad_join: lab-authorized-keys),
# like GitHub's https://github.com/<user>.keys: a key given once works on all of that
# person's machines, now and later, and replacing it here replaces it everywhere.
# Public keys aren't secret; HTTPS (certificate checked) makes sure they come from here.
location ~ "^/keys/[a-z][a-z0-9]{1,19}$" {   # quoted: nginx reads { as a block
    root /var/www/lab;
    default_type text/plain;
    try_files $uri =404;
}
