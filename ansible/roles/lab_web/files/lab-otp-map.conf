# /etc/nginx/conf.d/lab-otp-map.conf on mgmt01 (http context), deployed by roles/lab_web.
# Which client IP may fetch which machine's one-time join password. roles/join_otp
# writes one file per machine into /etc/nginx/lab-otp.d/, each a line like
#   /otp/ws03 10.10.10.23;
# (none at all is fine: then nobody may fetch anything). Used by lab-otp.conf.
map $uri $otp_allowed_ip {
    default "";
    include /etc/nginx/lab-otp.d/*.conf;
}
