# /etc/nginx/snippets/lab-otp.conf on mgmt01, deployed by roles/lab_web; included in
# the lab-facing server only (lab-portal.conf, port 443), never the internet-facing one.
#
# One-time AD join passwords (roles/join_otp publishes them): each may only be fetched
# from its own machine's reserved address (lab-otp-map.conf); everyone else gets 403.
# Fetches are logged to the lab-events log: the portal's worker reads a new machine's
# fetch as "joining the domain", a refused one as a failed build.
location ~ ^/otp/[a-z0-9-]+$ {
    access_log /var/log/nginx/lab-events.log lab_events;
    if ($otp_allowed_ip != $remote_addr) {
        return 403;
    }
    root /var/www/lab;
    default_type text/plain;
    try_files $uri =404;
}
