# A graphical desktop for workstations whose catalogue entry says kind: desktop
# (included by roles/workstation_role): Ubuntu's own GNOME desktop and login screen
# (GDM), as on any Ubuntu PC. People sign in at that login screen with their AD account
# (SSSD; only the machine's owner and the admins may). They reach it as the machine's
# own screen: in the browser (My lab: Desktop, pve01's console relay opened by
# Guacamole; roles/pve_console) or in the Proxmox UI. No remote-desktop server runs
# inside the VM. Headless machines (kind: headless) never get any of this.

# Already in the desktop image (ansible/group_vars/all.yml: desktop_packages); this
# keeps every desktop machine honest about it
- name: Ubuntu Desktop
  ansible.builtin.apt:
    name: "{{ desktop_packages }}"
    state: present

# A managed machine: no "Welcome to Ubuntu" first-login wizard, and no crash-report
# pop-ups for the person in front of it
- name: No first-login wizard
  ansible.builtin.apt:
    name: [gnome-initial-setup]
    state: absent
    purge: true

- name: No crash-report pop-ups
  ansible.builtin.lineinfile:
    path: /etc/default/apport
    regexp: '^enabled='
    line: enabled=0
    create: true
    mode: "0644"

- name: Crash reporter off
  ansible.builtin.systemd_service:
    name: apport
    enabled: false
    state: stopped
  failed_when: false          # not installed: nothing to stop

# GDM reads its login screen settings from this file (no drop-in directory); Ubuntu's
# copy has an [org/gnome/login-screen] section with the banner keys commented out
- name: The login screen says which account to use
  ansible.builtin.lineinfile:
    path: /etc/gdm3/greeter.dconf-defaults
    regexp: "^#? *{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    insertafter: '^\[org/gnome/login-screen\]'
  loop:
    - {key: banner-message-enable, value: "true"}
    - {key: banner-message-text, value: "'Sign in with your studio account: your username and password.'"}
  loop_control:
    label: "{{ item.key }}"
  notify: Restart the login screen

# The screen size for the login screen and every session (a person's own choice in
# Settings > Displays, in ~/.config/monitors.xml, still wins). The VM's virtual monitor
# starts at 1280x800; at 1920x1080 nobody needs to change it, which matters because a
# change drops a browser connection to a smaller picture until Desktop is clicked
# again (roles/portal: portal.py, guacamole_login)
- name: Full-HD screen by default
  ansible.builtin.copy:
    src: monitors.xml
    dest: /etc/xdg/monitors.xml
    mode: "0644"
  notify: Restart the login screen

# The screen never blanks and the machine never suspends itself. People see it as its
# own screen (My lab's Desktop: the VM console through Guacamole); a blanked display
# shows them black, and waking it changes the console's mode under the connection.
# Sleeping is Proxmox's job, from outside: idle machines hibernate (worker.py:
# hibernate_idle), so the guest's own suspend is switched off entirely.
- name: The login screen never suspends the machine
  ansible.builtin.lineinfile:
    path: /etc/gdm3/greeter.dconf-defaults
    regexp: "^#? *{{ item }}="
    line: "{{ item }}='nothing'"
    insertafter: '^\[org/gnome/settings-daemon/plugins/power\]'
  loop: [sleep-inactive-ac-type, sleep-inactive-battery-type]
  notify: Restart the login screen

- name: The login screen never blanks
  ansible.builtin.blockinfile:
    path: /etc/gdm3/greeter.dconf-defaults
    marker: "# {mark} roles/desktop: never blank"
    block: |
      [org/gnome/desktop/session]
      idle-delay=uint32 0
  notify: Restart the login screen

- name: Sessions read the lab's settings (dconf system database "local")
  ansible.builtin.copy:
    dest: /etc/dconf/profile/user
    content: |
      user-db:user
      system-db:local
    mode: "0644"
  notify: Update dconf

- name: Directory for the lab's session settings
  ansible.builtin.file:
    path: /etc/dconf/db/local.d/locks
    state: directory
    mode: "0755"

- name: Sessions never blank or suspend, and people can't turn that back on
  ansible.builtin.copy:
    dest: "/etc/dconf/db/local.d/{{ item.dest }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - dest: 00-lab-desktop
      content: |
        # roles/desktop: the screen is the VM console people use from the browser
        [org/gnome/desktop/session]
        idle-delay=uint32 0
        [org/gnome/settings-daemon/plugins/power]
        sleep-inactive-ac-type='nothing'
        sleep-inactive-battery-type='nothing'
        idle-dim=false
    - dest: locks/00-lab-desktop
      content: |
        /org/gnome/desktop/session/idle-delay
        /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type
        /org/gnome/settings-daemon/plugins/power/sleep-inactive-battery-type
  loop_control:
    label: "{{ item.dest }}"
  notify: Update dconf

- name: The guest itself can't sleep (nothing may suspend it from inside)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop: [sleep.target, suspend.target, hibernate.target, hybrid-sleep.target, suspend-then-hibernate.target]

- name: Boot to the login screen
  ansible.builtin.file:
    src: /usr/lib/systemd/system/graphical.target
    dest: /etc/systemd/system/default.target
    state: link

- name: The login screen running
  ansible.builtin.systemd_service:
    name: gdm3
    enabled: true
    state: started
