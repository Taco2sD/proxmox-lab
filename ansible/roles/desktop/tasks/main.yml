# A graphical desktop for workstations whose catalogue entry says kind: desktop
# (included by roles/workstation_role). XFCE: light enough for a VM without a GPU, and
# xrdp serves it over RDP, which Guacamole on mgmt01 opens in the browser (the portal's
# My lab: Open desktop). xrdp authenticates through PAM, so AD accounts work and the
# same rule as SSH decides who may log in (SSSD: the owner and the admins).
# Headless machines (kind: headless) never get any of this: they stay minimal.

# Already in the desktop image (ansible/group_vars/all.yml: desktop_packages); this
# keeps every desktop machine honest about it
- name: XFCE and xrdp
  ansible.builtin.apt:
    name: "{{ desktop_packages }}"
    install_recommends: false
    state: present

# xrdp's TLS key is Ubuntu's snakeoil one (/etc/ssl/private), readable by ssl-cert only
- name: Let xrdp read its TLS key
  ansible.builtin.user:
    name: xrdp
    groups: ssl-cert
    append: true
  notify: Restart xrdp

- name: The remote desktop server (xrdp) running
  ansible.builtin.systemd_service:
    name: xrdp
    enabled: true
    state: started
