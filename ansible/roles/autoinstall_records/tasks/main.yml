# mgmt01: one autoinstall host record per workstation, the nginx rule that serves
# each one-time password only to its own host, and the `lab` command itself.

- name: Host record directory
  ansible.builtin.file:
    path: "{{ autoinstall_web }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ workstations.keys() | list }}"

- name: user-data from mgmt01/template.yaml
  ansible.builtin.copy:
    dest: "{{ autoinstall_web }}/{{ item }}/user-data"
    content: >
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../mgmt01/template.yaml')
         | replace('__HOSTNAME__', item)
         | replace('__PWHASH__', lookup('ansible.builtin.file', autoinstall_pwhash_file) | trim)
         | replace('__SSHKEY__', lookup('ansible.builtin.file', autoinstall_sshkey_file) | trim) }}
    mode: "0644"
  loop: "{{ workstations.keys() | list }}"

- name: meta-data
  ansible.builtin.copy:
    dest: "{{ autoinstall_web }}/{{ item }}/meta-data"
    content: "instance-id: {{ item }}\n"
    mode: "0644"
  loop: "{{ workstations.keys() | list }}"

- name: MAC address -> host record (what GRUB's ${net_default_mac} asks for)
  ansible.builtin.file:
    src: "{{ item.key }}"
    dest: "{{ autoinstall_web }}/{{ item.value.mac | lower }}"
    state: link
    force: true
  loop: "{{ workstations | dict2items }}"
  loop_control:
    label: "{{ item.value.mac | lower }} -> {{ item.key }}"

- name: One-time password access map (each otp only for its host's IP)
  ansible.builtin.template:
    src: autoinstall-otp.map.j2
    dest: /etc/nginx/autoinstall-otp.map
    mode: "0644"
  notify: Reload nginx

- name: The lab command
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../mgmt01/lab"
    dest: /usr/local/bin/lab
    mode: "0755"

# ---- lab prune only ----------------------------------------------------------

- name: Find host records and MAC links on mgmt01
  ansible.builtin.find:
    paths: "{{ autoinstall_web }}"
    file_type: any
  register: autoinstall_entries
  when: prune | default(false) | bool

- name: Remove records and links for workstations no longer in the inventory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ autoinstall_entries.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - prune | default(false) | bool
    - (item.path | basename) != 'template.yaml'
    - (item.islnk and (item.lnk_source | basename) not in workstations)
      or (item.isdir and (item.path | basename) not in workstations)
