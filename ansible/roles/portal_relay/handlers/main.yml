- name: Restart relay
  ansible.builtin.systemd_service:
    name: lab-portal-relay.socket
    state: restarted
    daemon_reload: true

# lab.nft starts by deleting its own table, so loading it again replaces the rules
# instead of adding a second copy. Only touches table inet wglab.
- name: Reload tunnel firewall
  ansible.builtin.command: nft -f /etc/wireguard/lab.nft
  changed_when: true
