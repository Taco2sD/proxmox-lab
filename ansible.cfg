[defaults]
# Lives at the repo root because ansible-pull runs ansible-playbook from the top of
# the checkout (playbook: ansible/local.yml). mgmt01's `lab` points ANSIBLE_CONFIG here.
# No inventory line: ansible-pull always configures the machine it runs on (implicit
# localhost), and `lab` passes -i ansible/servers.yml for the servers.
interpreter_python = auto_silent
retry_files_enabled = false
# Don't log every module invocation to the managed host's journal: on mgmt01 that
# buried the portal's own log lines under Ansible's.
no_target_syslog = true
