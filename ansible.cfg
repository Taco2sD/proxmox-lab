[defaults]
# Lives at the repo root because ansible-pull runs ansible-playbook from the top of
# the checkout (playbook: ansible/local.yml).
# No inventory line: ansible-pull always configures the machine it runs on, and
# Ansible's implicit "localhost" covers that. ("localhost," only means a host list
# on the command line; here it would be read as file paths.)
interpreter_python = auto_silent
retry_files_enabled = false
