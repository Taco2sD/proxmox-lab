# /srv/tftp/grub/grub.cfg on mgmt01: the PXE boot menu for lab workstations.
#
# HTTPS where it can be: the autoinstall record (user-data with the admin password hash,
# and the URL of the one-time join password) comes from https://lab.radicallydecent.com,
# which resolves to mgmt01 inside the lab (AD DNS) and has a Let's Encrypt certificate
# the stock installer already trusts.
#
# The one exception is the installer ISO: GRUB and the initramfs fetch it before any TLS
# client exists, so it comes over plain HTTP from mgmt01 port 80, which serves nothing
# else. It's a public Ubuntu image with no secrets in it.
set default=0
set timeout=5

menuentry "Autoinstall Ubuntu 26.04 lab workstation" {
    echo "MAC: ${net_default_mac} - loading kernel..."
    linux /ubuntu-26.04/vmlinuz ip=dhcp url=http://10.10.10.6/ubuntu-26.04.1-live-server-amd64.iso cloud-config-url=/dev/null initramfs_options=size=90% autoinstall "ds=nocloud;s=https://lab.radicallydecent.com/autoinstall/${net_default_mac}/" ---
    echo "Loading initrd (96 MB over TFTP, give it a moment)..."
    initrd /ubuntu-26.04/initrd
}
