# /etc/nginx/snippets/autoinstall-otp.conf on mgmt01 (included in the default server)
# A host's one-time join password is only served to that host's own reserved IP.
# Anyone else, including requests through the MAC-address symlinks, gets 403.
location ~ ^/autoinstall/[^/]+/otp$ {
    if ($otp_allowed_ip != $remote_addr) {
        return 403;
    }
}
