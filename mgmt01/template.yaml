#cloud-config
# /var/www/html/autoinstall/template.yaml on mgmt01.
# provision-ws (on pve01) fills in the placeholders per host. No secrets in here.
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: Europe/Amsterdam
  identity:
    hostname: __HOSTNAME__
    username: labadmin
    realname: Local Admin
    password: "__PWHASH__"
  ssh:
    install-server: true
    allow-pw: false
    authorized-keys:
      - "__SSHKEY__"
  storage:
    layout:
      name: lvm
      sizing-policy: all
  packages:
    - qemu-guest-agent
    - ansible-core
    - git
  updates: security
  late-commands:
    - curtin in-target -- systemctl enable qemu-guest-agent
    # The AD one-time join password. nginx serves it only to this host's own
    # reserved IP; it is used once by the ad_join role, then deleted.
    - curtin in-target -- sh -c 'umask 077; curl -fsS https://lab.radicallydecent.com/autoinstall/__HOSTNAME__/otp -o /etc/ad-join-otp'
  # cloud-config for the installed system's first boot: enroll in config management.
  # From then on the ansible-pull timer (installed by the base role) takes over.
  user-data:
    runcmd:
      - [flock, /run/ansible-pull.lock, ansible-pull, --url, "https://github.com/Taco2sD/proxmox-lab.git", --checkout, main, --directory, /var/lib/ansible-pull, ansible/local.yml]
  shutdown: reboot
