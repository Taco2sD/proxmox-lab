# /etc/nginx/snippets/lab-portal-locations.conf on mgmt01: the portal and Apache
# Guacamole, shared by the lab-facing (443) and internet-facing (8443) servers.
client_max_body_size 8k;

location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Admin sign-in: rate-limited (conf.d/lab-limits.conf)
location = /api/admin/login {
    limit_req zone=admin_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Apache Guacamole (guacamole-compose.yml), as in Guacamole's manual: no buffering,
# WebSocket upgrade. No access log: the login link carries the encrypted credentials.
location /guacamole/ {
    proxy_pass http://127.0.0.1:8085;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 1h;
    client_max_body_size 64m;
    access_log off;
}
