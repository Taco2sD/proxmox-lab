# /etc/nginx/sites-enabled/lab-portal on mgmt01: the self-service portal on port 8080.
# Reached from outside only through the WireGuard tunnel (see docs/self-service.md).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    client_max_body_size 8k;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Apache Guacamole (mgmt01/portal/guacamole-compose.yml), as in Guacamole's manual:
    # no buffering, WebSocket upgrade. No access log: the login link carries the
    # encrypted credentials as ?data=...
    location /guacamole/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 1h;
        access_log off;
    }
}
