# /etc/nginx/sites-enabled/lab-portal on mgmt01. Everything is HTTPS with a Let's Encrypt
# certificate for lab.radicallydecent.com (certbot, DNS-01 via acme-dns; see
# ansible/portal.yml). Inside the lab the name resolves to mgmt01 (AD DNS zone).

# 443: the lab network. Portal, browser terminal, and what installing machines need.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name lab.radicallydecent.com;
    include snippets/lab-tls.conf;

    include snippets/lab-portal-locations.conf;

    # Autoinstall host records and one-time join passwords (each password only for its
    # host's reserved IP, see snippets/autoinstall-otp.conf)
    root /var/www/html;
    include snippets/autoinstall-otp.conf;
    location /autoinstall/ {
        try_files $uri =404;
    }
    # Workstations report finished configuration runs (ansible/local.yml); the portal
    # worker reads this request from the access log
    include snippets/lab-events.conf;
}

# 8443: the internet, via the VPS and pve01's relay (pve01/lab-portal-relay.*). The
# portal and the terminal only: no install records, no one-time passwords.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name lab.radicallydecent.com;
    include snippets/lab-tls.conf;

    include snippets/lab-portal-locations.conf;
}
