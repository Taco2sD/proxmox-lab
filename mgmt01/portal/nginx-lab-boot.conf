# /etc/nginx/sites-enabled/lab-boot on mgmt01: the only plain-HTTP service in the lab.
# GRUB and the installer's initramfs fetch the Ubuntu ISO before any TLS client exists
# (mgmt01/tftp-grub.cfg). It's a public image with no secrets; everything else lives on
# HTTPS (lab-portal), and this server answers 404 for anything but an ISO.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;

    location ~ ^/[^/]+\.iso$ {
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
