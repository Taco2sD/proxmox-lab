# /etc/nginx/snippets/lab-tls.conf on mgmt01: certificate and TLS settings for
# lab.radicallydecent.com (certbot keeps the files current and reloads nginx).
ssl_certificate /etc/letsencrypt/live/lab.radicallydecent.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/lab.radicallydecent.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:lab_tls:1m;
add_header Strict-Transport-Security "max-age=31536000" always;
