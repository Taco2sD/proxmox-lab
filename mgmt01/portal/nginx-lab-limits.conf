# /etc/nginx/conf.d/lab-limits.conf on mgmt01 (http context): slow down password
# guessing on the admin sign-in (snippets/lab-portal-locations.conf). Traffic from the
# internet all arrives through pve01's relay, so this is effectively one shared budget:
# 5 attempts a minute, a burst of 5, then 429 Too Many Requests. AD's own lockout
# policy still applies behind it.
limit_req_zone $binary_remote_addr zone=admin_login:1m rate=5r/m;
limit_req_status 429;
