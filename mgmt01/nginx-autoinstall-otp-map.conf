# /etc/nginx/conf.d/autoinstall-otp.conf on mgmt01 (http context)
# Which client IP may fetch which host's one-time join password.
# provision-ws keeps /etc/nginx/autoinstall-otp.map up to date, lines like:
#   /autoinstall/ws03/otp 10.10.10.23;
map $uri $otp_allowed_ip {
    default "";
    include /etc/nginx/autoinstall-otp.map;
}
