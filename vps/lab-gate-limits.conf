# /etc/nginx/conf.d/lab-gate-limits.conf on the VPS (http context): slow down password
# guessing on the sign-in gate (snippets/lab-gate.conf, location = /oauth2/sign_in).
#
# Only POSTs count: those are sign-in attempts, carrying a password. Visits to the page
# (GET) don't: an open Proxmox tab whose session expired polls the API every few seconds
# and is redirected to the sign-in page each time. When GETs counted, such a tab used up
# the shared allowance and every page of lab. and pve. answered 503 (docs/lessons.md).
# An empty key is not limited at all, so the map gives every method but POST an empty one.
map $request_method $lab_sign_in_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $lab_sign_in_key zone=lab_sign_in_posts:1m rate=5r/m;
# (The zone has a new name because nginx can't change an existing zone's key on reload:
# the old "lab_sign_in" zone was keyed on every request.)
