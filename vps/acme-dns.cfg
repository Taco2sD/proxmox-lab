# acme-dns: answers DNS-01 challenges for the lab's Let's Encrypt certificates.
# Each certificate name has a permanent CNAME
#   _acme-challenge.<name>.radicallydecent.com -> <uuid>.acme.radicallydecent.com
# and the machine that needs the certificate holds credentials that can only change
# the TXT record of its own <uuid>. The Porkbun API key (whole domain) stays elsewhere.
[general]
listen = "84.247.130.118:53"      # public address only; systemd-resolved keeps 127.0.0.53
protocol = "both4"
domain = "acme.radicallydecent.com"
nsname = "acme-ns.radicallydecent.com"
nsadmin = "jesse.radicallydecent.com"      # SOA contact: jesse@radicallydecent.com
records = [
    "acme.radicallydecent.com. NS acme-ns.radicallydecent.com.",
]
debug = false

[database]
engine = "sqlite"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
# Local only. nginx publishes just /update over HTTPS (acme-ns.radicallydecent.com),
# so accounts can only be registered from this machine.
ip = "127.0.0.1"
port = "8053"
tls = "none"
disable_registration = false
corsorigins = []
use_header = true
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "text"
