# /etc/oauth2-proxy/oauth2-proxy.cfg on the VPS: the sign-in gate in front of
# lab.radicallydecent.com and pve.radicallydecent.com (nginx auth_request, see
# vps/nginx-lab-gate.conf). Replaces HTTP Basic auth with a real sign-in page styled
# like the portal (templates/), and one session for both sites.
#
# Local accounts only: users.htpasswd (bcrypt). oauth2-proxy insists on an OAuth
# provider being configured; this one is a placeholder nobody can use, and nginx
# answers 404 for its start URL (/oauth2/start).

http_address = "127.0.0.1:4180"
reverse_proxy = true
trusted_proxy_ips = ["127.0.0.1/32"]   # only nginx on this machine may set X-Forwarded-*
upstreams = ["static://202"]          # auth_request mode: answer "signed in", proxy nothing

provider = "github"
client_id = "unused-local-accounts-only"
client_secret = "unused-local-accounts-only"
email_domains = ["*"]

htpasswd_file = "/etc/oauth2-proxy/users.htpasswd"
display_htpasswd_form = true
custom_templates_dir = "/etc/oauth2-proxy/templates"

cookie_name = "_lab_session"
cookie_secret_file = "/etc/oauth2-proxy/cookie-secret"
cookie_domains = [".radicallydecent.com"]     # one sign-in for lab. and pve.
whitelist_domains = [".radicallydecent.com"]  # where ?rd= may send you after sign-in
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "12h"
set_xauthrequest = true
