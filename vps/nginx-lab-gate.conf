# /etc/nginx/snippets/lab-gate.conf on the VPS: the sign-in gate (oauth2-proxy,
# vps/oauth2-proxy/) for a site. Included in the lab. and pve. servers; their
# `location /` adds:
#     auth_request /oauth2/auth;
#     error_page 401 = @lab_sign_in;

# Sign-in page, form posts, sign-out
location /oauth2/ {
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
}
# Password guessing: 5 sign-in attempts (POSTs) a minute per address, then 429
# (lab-gate-limits.conf explains why page visits don't count)
location = /oauth2/sign_in {
    limit_req zone=lab_sign_in_posts burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
# The placeholder OAuth provider must never be used
location = /oauth2/start {
    return 404;
}
# nginx's own question for every request: is this browser signed in? (202 / 401)
location = /oauth2/auth {
    internal;
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
}
location @lab_sign_in {
    return 302 /oauth2/sign_in?rd=https://$host$request_uri;
}
