# /etc/dnsmasq.d/lab-dhcp.conf on dc01: DHCP for the lab (moved here from pve01)
# DNS is Samba's job on this host, so dnsmasq's own DNS server stays off.
port=0
interface=ens18
bind-interfaces
dhcp-authoritative
dhcp-range=10.10.10.100,10.10.10.199,255.255.255.0,12h
dhcp-option=option:router,10.10.10.1
dhcp-option=option:dns-server,10.10.10.5
dhcp-option=option:domain-name,ad.lab.internal
dhcp-option=option:domain-search,ad.lab.internal
dhcp-option=option:ntp-server,10.10.10.5

# Reservations (MAC -> IP -> name): the single source of truth for addresses.
# DNS A + PTR records are derived from these by dhcp-script below.
#
# Static by necessity (not DHCP clients), outside the pool; their records were
# created once with samba-tool, the Infoblox "fixed address" equivalent:
#   10.10.10.1   Hyper-V host (LabNAT gateway)
#   10.10.10.5   dc01   (DNS + DHCP server itself)
#   10.10.10.10  pve01  (hypervisor)
dhcp-host=BC:24:11:52:66:01,10.10.10.6,mgmt01
dhcp-host=BC:24:11:10:A2:7C,10.10.10.20,ubuntu-ws01
dhcp-host=BC:24:11:00:00:21,10.10.10.21,ws01
dhcp-host=BC:24:11:00:00:22,10.10.10.22,ws02
dhcp-host=BC:24:11:00:00:23,10.10.10.23,ws03

# PXE: UEFI x86-64 clients (client-arch 7 or 9) boot bootx64.efi from mgmt01
dhcp-match=set:efi-x64,option:client-arch,7
dhcp-match=set:efi-x64,option:client-arch,9
dhcp-boot=tag:efi-x64,bootx64.efi,,10.10.10.6

# DDNS: on every lease event, register the client in AD DNS (as svc-dhcp-dns)
dhcp-script=/usr/local/sbin/dhcp-dns-update
